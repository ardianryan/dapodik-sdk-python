[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "dapodik-sdk"
version = "1.0.0"
description = "Modern, type-safe Python SDK untuk WebService Dapodik Kemendikdasmen"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Ryan Ardian", email = "inisaya@ardianryan.com" },
    { name = "SMA Negeri 1 Gedeg" }
]
keywords = [
    "dapodik",
    "dapodik-api",
    "dapodik-sdk",
    "kemendikdasmen",
    "webservice",
    "fastapi",
    "django",
    "flask",
    "pandas"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]
dependencies = []

[project.optional-dependencies]
dataframe = ["pandas>=1.5.0"]
async = ["httpx>=0.24.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "pandas>=1.5.0",
    "httpx>=0.24.0"
]

[project.urls]
Homepage = "https://www.instagram.com/smansagewithai/"
Repository = "https://github.com/ardianryan/dapodik-sdk-python"
Issues = "https://github.com/ardianryan/dapodik-sdk-python/issues"
Changelog = "https://github.com/ardianryan/dapodik-sdk-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/dapodik"]
